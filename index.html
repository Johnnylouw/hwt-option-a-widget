<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWT Option A converter</title>
  <link rel="icon" href="assets/hwt-logo.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/monthly.css">
  <link rel="stylesheet" href="css/widget.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="app widget">

    <section class="drop" id="drop">
      <h2>Drop a PDF</h2>
      <p class="privacy">Converted in your browser. Your PDF is never uploaded.</p>
      <div class="actions">
        <button type="button" class="primary" id="pick">Choose PDFs</button>
        <button type="button" class="ghost" id="clear" hidden>Clear</button>
      </div>
      <p class="file-hint" id="file-hint"></p>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </section>

    <section class="richie" id="richie" hidden>
      <div class="richie-head">
        <h3>Ask Richie</h3>
      </div>
      <form class="richie-form" id="richie-form" novalidate>
        <label class="rf-email">Your @hwt.co.za email
          <input type="email" id="richie-email" autocomplete="email" placeholder="name@hwt.co.za" required>
        </label>
        <label class="rf-note">Note (optional)
          <input type="text" id="richie-note" maxlength="500" placeholder="e.g. client name, deadline">
        </label>
        <div class="rf-file">
          <span id="richie-file">No PDF selected</span>
          <button type="button" class="ghost sm" id="richie-pick">Choose PDF</button>
          <input type="file" id="richie-input" accept="application/pdf,.pdf" hidden>
        </div>
        <div class="rf-go">
          <button type="submit" class="primary sm" id="richie-send">Send to Richie</button>
          <span class="rf-msg" id="richie-msg" role="status"></span>
        </div>
      </form>
    </section>

    <p class="status" id="status" role="status"></p>
    <div id="results"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/cleanup.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/render.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="js/monthly.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ask-richie.js"></script>
</body>
</html>
