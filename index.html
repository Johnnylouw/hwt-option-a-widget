<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWT Option A converter</title>
  <link rel="icon" href="assets/hwt-logo.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/monthly.css">
  <link rel="stylesheet" href="css/widget.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="app widget">

    <section class="drop" id="drop">
      <h2>Drop an HWT proposal or monthly report PDF</h2>
      <p class="privacy">Converted in your browser. Your PDF is never uploaded.</p>
      <p class="ask-richie">Rather have Richie do it? <a href="mailto:johan@hwt.co.za?subject=Ask%20Richie%3A%20Option%20A&body=Hi%20Richie%2C%20please%20convert%20the%20attached%20PDF%20to%20Option%20A.%0A%0A(Attach%20the%20proposal%20or%20monthly%20report%20PDF%20before%20sending.)" target="_top">Email the PDF to Richie</a> from your @hwt.co.za address and the Option A PDF comes back by email (weekdays, usually within 15 minutes).</p>
      <div class="actions">
        <button type="button" class="primary" id="pick">Choose PDFs</button>
        <button type="button" class="ghost" id="clear" hidden>Clear</button>
      </div>
      <p class="file-hint" id="file-hint"></p>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </section>

    <p class="status" id="status" role="status"></p>
    <div id="results"></div>
  </main>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/cleanup.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/render.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="js/monthly.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
